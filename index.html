<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falcon World</title>
</head>

<body style="
    margin:0;
    background:#071426;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    padding-top:80px;
">

    <h1 style="font-size:42px;">🦅</h1>

    <h2>FALCON WORLD</h2>

    <p>Mini App Test</p>

    <div id="status" style="
        margin:30px;
        padding:20px;
        background:#10233d;
        border-radius:15px;
    ">
        Loading...
    </div>

    <script>
        const status = document.getElementById("status");

        status.innerHTML = "✅ Falcon World is working!";

        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            status.innerHTML += "<br><br>📱 Telegram Mini App detected!";
        } else {
            status.innerHTML += "<br><br>🌐 Browser mode";
        }
    </script>

</body>
</html>
